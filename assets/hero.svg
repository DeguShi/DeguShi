<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="Felipe Azambuja, University of São Paulo. A graph of research interests (world models, object-centric learning, embodied agents, LLM agents, graph neural networks, computer vision, epidemic modeling) bridged to building interests (products, web apps, mobile apps, backends, dev tools, data pipelines, open source)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121c"/>
      <stop offset="1" stop-color="#1b1826"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset=".5" stop-color="#f2efe9"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" x2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <radialGradient id="glowR" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF7A59" stop-opacity=".13"/>
      <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".9" fill="#2a2636"/>
    </pattern>
    <style>
      .name { font: 800 54px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1px; }
      .sub  { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8a849c; letter-spacing: .5px; }
      .tag  { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .lbl  { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d9d4cc; }

      .edge { fill: none; stroke-width: 1.3; stroke-dasharray: 3 6; animation: flow 1.8s linear infinite; opacity: .5; }
      .r { stroke: #2DD4BF; } .b { stroke: #FF7A59; animation-direction: reverse; }
      .br { stroke: url(#bridge); stroke-width: 1.6; opacity: .75; stroke-dasharray: 5 6; }
      @keyframes flow { to { stroke-dashoffset: -18; } }

      .pulse { fill: none; stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .85; } 100% { transform: scale(3.4); opacity: 0; } }

      .floatA { animation: float 7s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

      .rise { opacity: 0; animation: rise .9s ease-out forwards; }
      .rise2 { animation-delay: .25s; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect x=".5" y=".5" width="959" height="469" rx="18" fill="url(#bg)" stroke="#2a2636"/>
  <rect x=".5" y=".5" width="959" height="469" rx="18" fill="url(#dots)"/>
  <ellipse cx="245" cy="325" rx="250" ry="150" fill="url(#glowR)"/>
  <ellipse cx="715" cy="325" rx="250" ry="150" fill="url(#glowB)"/>

  <!-- title -->
  <g class="rise">
    <text x="480" y="92" class="name" text-anchor="middle" fill="url(#name)">Felipe Azambuja</text>
  </g>
  <g class="rise rise2">
    <text x="480" y="128" class="sub" text-anchor="middle">University of São Paulo · São Carlos, BR<tspan class="caret" fill="#FF7A59"> ▍</tspan></text>
  </g>

  <text x="245" y="190" class="tag" text-anchor="middle" fill="#2DD4BF">RESEARCH</text>
  <text x="715" y="190" class="tag" text-anchor="middle" fill="#FF7A59">BUILDING</text>

  <g class="floatA">
  <!-- bridges: research <-> building -->
  <path id="br1" class="edge br" d="M310 232 Q480 175 650 232"/>
  <path id="br2" class="edge br" d="M400 318 Q480 292 560 318"/>
  <path id="br3" class="edge br" d="M345 405 Q480 450 615 405"/>
  <g>
    <circle r="2.8" fill="#e8fffb"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#br1"/></animateMotion></circle>
    <circle r="2.8" fill="#fff1ea"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#br1"/></animateMotion></circle>
    <circle r="2.6" fill="#fff1ea"><animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#br2"/></animateMotion></circle>
    <circle r="2.6" fill="#e8fffb"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#br2"/></animateMotion></circle>
    <circle r="2.8" fill="#e8fffb"><animateMotion dur="4.2s" begin=".6s" repeatCount="indefinite"><mpath href="#br3"/></animateMotion></circle>
    <circle r="2.8" fill="#fff1ea"><animateMotion dur="4.2s" begin="2.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#br3"/></animateMotion></circle>
  </g>

  <!-- research cluster -->
  <g>
    <path class="edge r" d="M140 240 L310 232"/>
    <path class="edge r" d="M140 240 L95 335"/>
    <path class="edge r" d="M140 240 L250 320"/>
    <path class="edge r" d="M310 232 L400 318"/>
    <path class="edge r" d="M310 232 L345 405"/>
    <path class="edge r" d="M95 335 L180 410"/>
    <path class="edge r" d="M250 320 L400 318"/>
    <path class="edge r" d="M250 320 L180 410"/>
    <path class="edge r" d="M400 318 L345 405"/>
    <path class="edge r" d="M345 405 L180 410"/>

    <g fill="#2DD4BF" stroke="#2DD4BF">
      <circle cx="140" cy="240" r="6" class="pulse" style="animation-delay:0s"/>
      <circle cx="310" cy="232" r="6" class="pulse" style="animation-delay:.5s"/>
      <circle cx="95"  cy="335" r="6" class="pulse" style="animation-delay:1s"/>
      <circle cx="250" cy="320" r="6" class="pulse" style="animation-delay:1.5s"/>
      <circle cx="400" cy="318" r="6" class="pulse" style="animation-delay:2s"/>
      <circle cx="180" cy="410" r="6" class="pulse" style="animation-delay:2.5s"/>
      <circle cx="345" cy="405" r="6" class="pulse" style="animation-delay:3s"/>
      <g stroke="none">
        <circle cx="140" cy="240" r="6"/><circle cx="310" cy="232" r="6"/><circle cx="95" cy="335" r="6"/>
        <circle cx="250" cy="320" r="6"/><circle cx="400" cy="318" r="6"/><circle cx="180" cy="410" r="6"/>
        <circle cx="345" cy="405" r="6"/>
      </g>
    </g>
    <text x="140" y="223" class="lbl" text-anchor="middle">World Models</text>
    <text x="310" y="215" class="lbl" text-anchor="middle">Object-Centric Learning</text>
    <text x="95"  y="362" class="lbl" text-anchor="middle">Embodied Agents</text>
    <text x="250" y="347" class="lbl" text-anchor="middle">LLM Agents</text>
    <text x="400" y="345" class="lbl" text-anchor="middle">GNNs</text>
    <text x="180" y="437" class="lbl" text-anchor="middle">Epidemic Modeling</text>
    <text x="345" y="432" class="lbl" text-anchor="middle">Computer Vision</text>
  </g>

  <!-- building cluster (mirror) -->
  <g>
    <path class="edge b" d="M820 240 L650 232"/>
    <path class="edge b" d="M820 240 L865 335"/>
    <path class="edge b" d="M820 240 L710 320"/>
    <path class="edge b" d="M650 232 L560 318"/>
    <path class="edge b" d="M650 232 L615 405"/>
    <path class="edge b" d="M865 335 L780 410"/>
    <path class="edge b" d="M710 320 L560 318"/>
    <path class="edge b" d="M710 320 L780 410"/>
    <path class="edge b" d="M560 318 L615 405"/>
    <path class="edge b" d="M615 405 L780 410"/>

    <g fill="#FF7A59" stroke="#FF7A59">
      <circle cx="820" cy="240" r="6" class="pulse" style="animation-delay:.25s"/>
      <circle cx="650" cy="232" r="6" class="pulse" style="animation-delay:.75s"/>
      <circle cx="865" cy="335" r="6" class="pulse" style="animation-delay:1.25s"/>
      <circle cx="710" cy="320" r="6" class="pulse" style="animation-delay:1.75s"/>
      <circle cx="560" cy="318" r="6" class="pulse" style="animation-delay:2.25s"/>
      <circle cx="780" cy="410" r="6" class="pulse" style="animation-delay:2.75s"/>
      <circle cx="615" cy="405" r="6" class="pulse" style="animation-delay:3.25s"/>
      <g stroke="none">
        <circle cx="820" cy="240" r="6"/><circle cx="650" cy="232" r="6"/><circle cx="865" cy="335" r="6"/>
        <circle cx="710" cy="320" r="6"/><circle cx="560" cy="318" r="6"/><circle cx="780" cy="410" r="6"/>
        <circle cx="615" cy="405" r="6"/>
      </g>
    </g>
    <text x="820" y="223" class="lbl" text-anchor="middle">Web Apps</text>
    <text x="650" y="215" class="lbl" text-anchor="middle">Products</text>
    <text x="865" y="362" class="lbl" text-anchor="middle">Mobile Apps</text>
    <text x="710" y="347" class="lbl" text-anchor="middle">APIs &amp; Backends</text>
    <text x="560" y="345" class="lbl" text-anchor="middle">Dev Tools</text>
    <text x="780" y="437" class="lbl" text-anchor="middle">Open Source</text>
    <text x="615" y="432" class="lbl" text-anchor="middle">Data Pipelines</text>
  </g>
  </g>
</svg>
