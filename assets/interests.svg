<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Interest graph: world models, object-centric learning, embodied agents, computer vision, LLM agents, graph neural networks and epidemic modeling, all connected through building things">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4169E1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4169E1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hubFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#4169E1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2a4a"/>
    </pattern>
    <style>
      .edge { fill: none; stroke-width: 1.4; stroke-dasharray: 3 7; animation: flow 1.6s linear infinite; opacity: .55; }
      .e-l { stroke: #38BDF8; } .e-r { stroke: #A78BFA; } .e-h { stroke: #60A5FA; opacity: .7; }
      @keyframes flow { to { stroke-dashoffset: -20; } }

      .pulse { fill: none; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(3.2); opacity: 0; } }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.35s; } .d5 { animation-delay: 1.8s; } .d6 { animation-delay: 2.25s; } .d7 { animation-delay: 2.7s; }

      .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
      .spin-r { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .label { font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .hub-label { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .chrome { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6b8c; }
      .tag { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }

      .fade { opacity: 0; animation: fadein .8s ease-out forwards; }
      .f1 { animation-delay: .1s; } .f2 { animation-delay: .3s; } .f3 { animation-delay: .5s; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <!-- panel -->
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="url(#bg)" stroke="#1f2b4d"/>
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="url(#dots)"/>

  <!-- window chrome -->
  <circle cx="24" cy="22" r="5" fill="#ff5f57"/>
  <circle cx="42" cy="22" r="5" fill="#febc2e"/>
  <circle cx="60" cy="22" r="5" fill="#28c840"/>
  <text x="80" y="26" class="chrome">felipe@usp:~$ cat interests.graph</text>

  <text x="60" y="335" class="tag" fill="#38BDF8">LEARNING TO SEE &amp; ACT</text>
  <text x="900" y="335" class="tag" fill="#A78BFA" text-anchor="end">READING THE WORLD</text>

  <!-- edges: left cluster -->
  <path id="p-wm-ocl"  class="edge e-l" d="M210 115 L120 215"/>
  <path id="p-wm-ea"   class="edge e-l" d="M210 115 L285 265"/>
  <path id="p-ocl-ea"  class="edge e-l" d="M120 215 L285 265"/>
  <path id="p-ocl-cv"  class="edge e-l" d="M120 215 L360 85" style="opacity:.3"/>
  <path id="p-cv-wm"   class="edge e-l" d="M360 85 L210 115"/>
  <!-- edges: right cluster -->
  <path id="p-llm-gnn" class="edge e-r" d="M680 95 L835 195"/>
  <path id="p-gnn-epi" class="edge e-r" d="M835 195 L665 270"/>
  <path id="p-llm-epi" class="edge e-r" d="M680 95 L665 270"/>
  <path id="p-cv-llm"  class="edge e-r" d="M360 85 L680 95" style="opacity:.25"/>
  <!-- edges: everything flows through building -->
  <path id="h-wm"  class="edge e-h" d="M210 115 Q340 150 480 180"/>
  <path id="h-ea"  class="edge e-h" d="M285 265 Q380 210 480 180"/>
  <path id="h-cv"  class="edge e-h" d="M360 85 Q430 120 480 180"/>
  <path id="h-ocl" class="edge e-h" d="M120 215 Q300 200 480 180"/>
  <path id="h-llm" class="edge e-h" d="M680 95 Q570 120 480 180"/>
  <path id="h-gnn" class="edge e-h" d="M835 195 Q650 200 480 180"/>
  <path id="h-epi" class="edge e-h" d="M665 270 Q570 240 480 180"/>

  <!-- travelling signals -->
  <g fill="#e0f2fe">
    <circle r="2.6"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#h-wm"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.4s" begin="0.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#h-llm"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.1s" begin="1.2s" repeatCount="indefinite"><mpath href="#h-epi"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.5s" begin="0.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#h-ea"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="3.8s" begin="1.9s" repeatCount="indefinite"><mpath href="#h-gnn"/></animateMotion></circle>
    <circle r="2.2" fill="#7dd3fc"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-ocl-ea"/></animateMotion></circle>
    <circle r="2.2" fill="#c4b5fd"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#p-gnn-epi"/></animateMotion></circle>
    <circle r="2.2" fill="#c4b5fd"><animateMotion dur="2.4s" begin="0.3s" repeatCount="indefinite"><mpath href="#p-llm-gnn"/></animateMotion></circle>
  </g>

  <!-- left nodes -->
  <g class="fade f1">
    <circle cx="210" cy="115" r="7" class="pulse d1" stroke="#38BDF8"/>
    <circle cx="210" cy="115" r="7" fill="#38BDF8"/>
    <text x="210" y="96" class="label" text-anchor="middle">World Models</text>

    <circle cx="120" cy="215" r="7" class="pulse d3" stroke="#38BDF8"/>
    <circle cx="120" cy="215" r="7" fill="#38BDF8"/>
    <text x="120" y="244" class="label" text-anchor="middle">Object-Centric</text>
    <text x="120" y="261" class="label" text-anchor="middle">Learning</text>

    <circle cx="285" cy="265" r="7" class="pulse d5" stroke="#38BDF8"/>
    <circle cx="285" cy="265" r="7" fill="#38BDF8"/>
    <text x="285" y="294" class="label" text-anchor="middle">Embodied Agents</text>

    <circle cx="360" cy="85" r="7" class="pulse d7" stroke="#22D3EE"/>
    <circle cx="360" cy="85" r="7" fill="#22D3EE"/>
    <text x="360" y="66" class="label" text-anchor="middle">Computer Vision</text>
  </g>

  <!-- right nodes -->
  <g class="fade f2">
    <circle cx="680" cy="95" r="7" class="pulse d2" stroke="#A78BFA"/>
    <circle cx="680" cy="95" r="7" fill="#A78BFA"/>
    <text x="680" y="76" class="label" text-anchor="middle">LLM Agents</text>

    <circle cx="835" cy="195" r="7" class="pulse d4" stroke="#A78BFA"/>
    <circle cx="835" cy="195" r="7" fill="#A78BFA"/>
    <text x="835" y="224" class="label" text-anchor="middle">Graph Neural</text>
    <text x="835" y="241" class="label" text-anchor="middle">Networks</text>

    <circle cx="665" cy="270" r="7" class="pulse d6" stroke="#A78BFA"/>
    <circle cx="665" cy="270" r="7" fill="#A78BFA"/>
    <text x="665" y="299" class="label" text-anchor="middle">Epidemic Modeling</text>
  </g>

  <!-- hub: building things -->
  <g class="fade f3">
    <circle cx="480" cy="180" r="62" fill="url(#hubGlow)"/>
    <circle cx="480" cy="180" r="44" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="2 6" class="spin"/>
    <circle cx="480" cy="180" r="36" fill="none" stroke="#A78BFA" stroke-width="1" stroke-dasharray="14 10" opacity=".7" class="spin-r"/>
    <circle cx="480" cy="180" r="28" fill="url(#hubFill)"/>
    <path d="M471 172 l-8 8 8 8 M489 172 l8 8 -8 8 M484 166 l-8 28" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="244" class="hub-label" text-anchor="middle">Building Things</text>
  </g>
</svg>
